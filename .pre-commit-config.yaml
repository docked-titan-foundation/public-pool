---
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args: ["--ignore", "CHANGELOG.md"]

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: mise
        args:
          - run
          - commitlint
        language: system
        stages: [commit-msg]
        pass_filenames: true
      - id: docker-build
        name: Build Docker image
        entry: mise
        args:
          - run
          - build
        language: system
        stages: [pre-commit]
        files: ^Dockerfile$
      - id: hadolint-main
        name: Lint main Dockerfile
        entry: mise
        args:
          - run
          - lint:docker
        language: system
        stages: [pre-commit]
        files: ^Dockerfile$
        pass_filenames: false
      - id: integration-test
        name: Run integration tests
        entry: mise
        args:
          - run
          - test
        language: system
        stages: [pre-commit]
        always_run: true
      - id: release-config-validate
        name: Validate semantic release configuration
        entry: ./scripts/validate-release-config.sh
        language: system
        stages: [pre-commit]
        files: ^(release\.config\.js|scripts/update-versions\.sh|README\.md|\.mise\.toml|scripts/validate-release-config\.sh)$
        pass_filenames: false
